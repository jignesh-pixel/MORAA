name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moraa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moraa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (SQLite, default suite)
        run: python -m pytest -q

      - name: Tests (PostgreSQL, same suite plus PostgreSQL-only tests)
        # Every test database becomes its own schema in a real PostgreSQL, so row locks,
        # strict typing and foreign keys are exercised. TEST_DATABASE_URL points at the
        # service container above (db_support refuses non-local hosts).
        env:
          MORAA_TEST_DB: postgres
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/moraa_test
        shell: bash   # bash -eo pipefail: a failing pytest must fail the step, not be hidden by tee/grep
        run: |
          python -m pytest -q -rs 2>&1 | tee pg-test-output.txt
          if grep -q "PostgreSQL-only test" pg-test-output.txt; then
            echo "A PostgreSQL-only test was skipped in the PostgreSQL run"; exit 1
          fi

      - name: Dependency audit (pip-audit)
        # Audits the exact pinned versions. Accepted findings must be listed with a reason in
        # backend/pip-audit-ignore.txt (one advisory id per line, # comments allowed).
        run: |
          IGNORES=$(grep -vE '^\s*(#|$)' pip-audit-ignore.txt 2>/dev/null | sed 's/\s*#.*//' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r constraints.txt --no-deps --disable-pip --strict $IGNORES

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Type check
        run: npx --prefix frontend tsc --noEmit
