name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (SQLite, default suite)
        run: python -m pytest -q

      - name: Dependency audit (pip-audit)
        # Audits the exact pinned versions. Accepted findings must be listed with a reason in
        # backend/pip-audit-ignore.txt (one advisory id per line, # comments allowed).
        run: |
          IGNORES=$(grep -vE '^\s*(#|$)' pip-audit-ignore.txt 2>/dev/null | sed 's/\s*#.*//' | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit -r constraints.txt --no-deps --disable-pip --strict $IGNORES

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit
