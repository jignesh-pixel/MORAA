<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===== Origin box (studio / generated images ready) ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120,420 C118,416 300,414 304,420 C308,470 306,560 302,566 C298,570 124,568 120,564 C116,530 116,448 120,420 Z"/>
  </g>
  <!-- stacked postcards inside box -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="150" y="450" width="90" height="66" rx="4" transform="rotate(-6 195 483)"/>
    <rect x="160" y="452" width="90" height="66" rx="4" transform="rotate(3 205 485)"/>
  </g>
  <text x="110" y="600" font-size="26" fill="#111111" transform="rotate(-1 110 600)">Photos ready</text>

  <!-- winding orange path from origin to mailbox -->
  <path d="M300,520 C420,560 480,460 560,520 C640,580 700,470 800,530 C900,590 960,480 1060,540 C1140,588 1180,520 1230,500"
        stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="1 0"/>
  <path d="M1230,500 L1206,494 M1230,500 L1214,516" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="640" y="440" font-size="26" fill="#111111" transform="rotate(-1 640 440)">Deliver</text>

  <!-- ===== Xiaohei courier riding a simple bicycle, carrying postcard bundle ===== -->
  <g transform="translate(720,560) scale(1.3)">
    <!-- bicycle wheels -->
    <circle cx="-30" cy="30" r="26" stroke="#111111" stroke-width="3.5" fill="none"/>
    <circle cx="40" cy="30" r="26" stroke="#111111" stroke-width="3.5" fill="none"/>
    <path d="M-30,30 L4,-6 L40,30 M4,-6 L4,10" stroke="#111111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- xiaohei body sitting on bike -->
    <path d="M -14,-16 C -22,-26 -24,-42 -16,-52 C -8,-62 8,-64 18,-58 C 28,-52 32,-40 30,-28 C 28,-16 18,-8 4,-6 C -6,-4 -10,-8 -14,-16 Z" fill="#111111" transform="translate(-4,-10)"/>
    <circle cx="-12" cy="-58" r="4" fill="#ffffff"/>
    <circle cx="0" cy="-56" r="4" fill="#ffffff"/>
  </g>

  <!-- postcard bundle on the back rack -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <rect x="810" y="500" width="66" height="48" rx="4" transform="rotate(-5 843 524)"/>
    <rect x="820" y="504" width="66" height="48" rx="4" transform="rotate(4 853 528)"/>
    <rect x="815" y="496" width="66" height="48" rx="4" transform="rotate(-2 848 520)"/>
  </g>

  <!-- ===== Mailbox / phone shape (WhatsApp) ===== -->
  <g stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1270,320 C1268,316 1420,314 1424,320 C1430,400 1428,600 1422,608 C1418,612 1274,610 1270,606 C1264,540 1264,380 1270,320 Z"/>
    <path d="M1290,380 L1404,378"/>
  </g>
  <!-- mail slot -->
  <path d="M1300,460 C1330,448 1370,448 1398,460" stroke="#111111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="1290" y="650" font-size="28" fill="#111111" transform="rotate(-1 1290 650)">WhatsApp</text>

  <!-- postcard entering slot -->
  <rect x="1310" y="410" width="60" height="42" rx="4" stroke="#e07b1a" stroke-width="3" fill="none" transform="rotate(-8 1340 431)"/>

  <!-- ===== feedback flags popping up from mailbox ===== -->
  <!-- thumbs up -->
  <g stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1330,260)">
    <path d="M0,40 L0,0 L10,-14 C16,-20 26,-16 24,-6 L20,4 L38,4 C46,4 48,12 42,18 L36,40 Z"/>
  </g>
  <text x="1300" y="220" font-size="24" fill="#e07b1a" transform="rotate(-2 1300 220)">Liked</text>

  <!-- thumbs down -->
  <g stroke="#d63031" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1470,300) scale(1,-1)">
    <path d="M0,40 L0,0 L10,-14 C16,-20 26,-16 24,-6 L20,4 L38,4 C46,4 48,12 42,18 L36,40 Z"/>
  </g>
  <text x="1450" y="360" font-size="24" fill="#d63031" transform="rotate(-2 1450 360)">Retry</text>

  <!-- blue feedback loop arrow back toward xiaohei/origin -->
  <path d="M1350,250 C1150,150 700,160 400,300" stroke="#3b6fd6" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>
  <path d="M400,300 L426,296 M400,300 L414,320" stroke="#3b6fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="700" y="200" font-size="26" fill="#3b6fd6" transform="rotate(-1 700 200)">Feedback</text>
</svg>
