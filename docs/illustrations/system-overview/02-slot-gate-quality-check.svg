<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===== Incoming photo (left) ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120,320 C118,316 320,314 324,320 C328,380 326,470 322,476 C318,480 124,478 120,474 C116,440 116,348 120,320 Z"/>
    <path d="M160,430 C180,390 210,390 220,420 C232,400 260,395 270,430" />
    <circle cx="200" cy="360" r="14"/>
  </g>
  <text x="130" y="510" font-size="26" fill="#111111" transform="rotate(-1 130 510)">New photo</text>

  <!-- orange arrow to dial -->
  <path d="M335,400 C400,395 440,395 480,398" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M480,398 L456,390 M480,398 L460,412" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Slot dial / gauge ===== -->
  <g stroke="#111111" stroke-width="4.5" fill="none">
    <circle cx="640" cy="400" r="150"/>
    <path d="M640,400 L640,270" transform="rotate(35 640 400)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="640" cy="400" r="10" fill="#111111"/>
  </g>
  <!-- tick marks -->
  <g stroke="#111111" stroke-width="3">
    <path d="M640,258 L640,280"/>
    <path d="M745,340 L727,352" transform=""/>
    <path d="M745,460 L727,448"/>
    <path d="M535,340 L553,352"/>
    <path d="M535,460 L553,448"/>
  </g>
  <text x="600" y="600" font-size="30" fill="#111111" transform="rotate(-1 600 600)">Slots: 0</text>

  <!-- red bounce path back down for unfunded -->
  <path d="M560,520 C480,580 380,610 260,600" stroke="#d63031" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="1 14"/>
  <path d="M260,600 L282,590 M260,600 L280,614" stroke="#d63031" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <text x="150" y="660" font-size="28" fill="#d63031" transform="rotate(-2 150 660)">Recharge</text>

  <!-- Xiaohei #1 reading the dial -->
  <g transform="translate(560,610) scale(1.35)">
    <path d="M -20,-2 C -28,-14 -30,-34 -22,-46 C -14,-58 4,-62 16,-56 C 28,-50 34,-36 32,-22 C 30,-8 20,2 4,4 C -8,6 -14,4 -20,-2 Z" fill="#111111"/>
    <circle cx="-4" cy="-40" r="4.5" fill="#ffffff"/>
    <circle cx="10" cy="-38" r="4.5" fill="#ffffff"/>
    <path d="M -10,2 L -13,22" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6,3 L 10,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M -17,22 L -9,22 M 6,23 L 14,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20,-40 C 40,-55 55,-58 68,-56" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- orange arrow onward (funded path) -->
  <path d="M800,380 C900,370 950,368 1000,372" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1000,372 L976,364 M1000,372 L980,386" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Xiaohei #2 with magnifying glass over photo ===== -->
  <g transform="translate(1130,470) scale(1.4)">
    <path d="M -20,-2 C -28,-14 -30,-34 -22,-46 C -14,-58 4,-62 16,-56 C 28,-50 34,-36 32,-22 C 30,-8 20,2 4,4 C -8,6 -14,4 -20,-2 Z" fill="#111111"/>
    <circle cx="-4" cy="-40" r="4.5" fill="#ffffff"/>
    <circle cx="10" cy="-38" r="4.5" fill="#ffffff"/>
    <path d="M -10,2 L -13,22" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6,3 L 10,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M -17,22 L -9,22 M 6,23 L 14,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- magnifying glass -->
  <g stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round">
    <circle cx="1195" cy="380" r="46"/>
    <path d="M1228,412 L1266,450"/>
  </g>
  <!-- small photo under glass -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <path d="M1165,405 C1163,402 1225,401 1227,405 C1229,428 1228,450 1226,453 C1224,455 1167,455 1165,452 C1163,438 1163,415 1165,405 Z"/>
  </g>
  <text x="1130" y="330" font-size="24" fill="#3b6fd6" transform="rotate(-1 1130 330)">Quality check</text>

  <!-- fork: pass (top) -->
  <path d="M1300,400 C1360,360 1400,330 1440,300" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1440,300 L1414,300 M1440,300 L1430,324" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1452,268 L1468,286 L1500,244" stroke="#e07b1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1400" y="230" font-size="28" fill="#111111" transform="rotate(-1 1400 230)">Pass</text>

  <!-- fork: retake (bottom) -->
  <path d="M1300,440 C1360,500 1400,560 1420,630" stroke="#d63031" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="1 14"/>
  <path d="M1420,630 L1400,614 M1420,630 L1398,636" stroke="#d63031" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <text x="1340" y="700" font-size="28" fill="#d63031" transform="rotate(-1 1340 700)">Retake</text>
</svg>
