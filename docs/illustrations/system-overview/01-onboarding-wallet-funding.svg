<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===== Phone chat bubble (left, input) ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M170,150 C168,148 610,146 616,152 C620,180 618,330 614,338 C610,344 330,342 300,342 L250,392 L262,340 C200,338 168,336 166,330 C162,300 164,178 170,150 Z"/>
  </g>
  <text x="330" y="240" font-size="60" fill="#111111" transform="rotate(-2 330 240)">Hi</text>
  <g stroke="#555555" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M200,270 L560,266"/>
    <path d="M200,295 L520,292"/>
    <path d="M200,318 L480,316"/>
  </g>
  <text x="205" y="262" font-size="22" fill="#3b6fd6" transform="rotate(-1 205 262)">Name / Business / GST</text>

  <!-- registration card below phone -->
  <g stroke="#111111" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M188,430 C186,426 470,424 474,430 C478,450 476,520 472,526 C468,530 194,528 190,524 C186,506 186,448 188,430 Z"/>
    <path d="M210,458 L440,455"/>
    <path d="M210,480 L410,478"/>
    <path d="M210,502 L390,501"/>
  </g>
  <text x="205" y="562" font-size="26" fill="#111111" transform="rotate(-1 205 562)">Register</text>

  <!-- orange flow arrow from card to xiaohei/jar -->
  <path d="M500,480 C600,470 660,500 700,540 C730,570 745,590 760,610" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M760,610 L738,596 M760,610 L748,632" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Coin dropping toward jar ===== -->
  <g stroke="#d63031" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="905" cy="300" r="34"/>
    <path d="M892,286 L918,286 M892,286 L908,316 M892,298 L912,298"/>
  </g>
  <text x="862" y="368" font-size="24" fill="#d63031" transform="rotate(-1 862 368)">Rs 500</text>
  <path d="M905,334 C900,380 892,420 886,460" stroke="#d63031" stroke-width="3" stroke-dasharray="2 10" fill="none" stroke-linecap="round"/>

  <!-- ===== Jar (wallet) held by Xiaohei ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M846,486 C844,482 940,480 944,486 C950,560 948,660 940,676 C934,686 856,686 850,676 C842,658 842,510 846,486 Z"/>
    <path d="M846,500 L944,498"/>
  </g>
  <!-- fill line inside jar (wallet balance) -->
  <path d="M852,610 L936,608" stroke="#3b6fd6" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M852,610 C852,650 856,668 862,676 L928,674 C934,666 936,640 936,608" fill="#3b6fd6" opacity="0.18"/>
  <text x="836" y="712" font-size="26" fill="#3b6fd6" transform="rotate(-1 836 712)">Wallet</text>

  <!-- ===== Xiaohei standing next to jar, one arm up ===== -->
  <g transform="translate(770,690) scale(1.5)">
    <path d="M -20,-2 C -28,-14 -30,-34 -22,-46 C -14,-58 4,-62 16,-56 C 28,-50 34,-36 32,-22 C 30,-8 20,2 4,4 C -8,6 -14,4 -20,-2 Z" fill="#111111"/>
    <circle cx="-4" cy="-40" r="4.5" fill="#ffffff"/>
    <circle cx="10" cy="-38" r="4.5" fill="#ffffff"/>
    <path d="M -10,2 L -13,22" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6,3 L 10,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M -17,22 L -9,22 M 6,23 L 14,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 24,-30 C 34,-40 40,-46 46,-52" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- orange arrow from xiaohei/jar to turnstile -->
  <path d="M960,560 C1030,540 1080,530 1140,520" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1140,520 L1116,514 M1140,520 L1122,536" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- ===== Turnstile gate (open) ===== -->
  <g stroke="#111111" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1190,300 L1186,660"/>
    <path d="M1420,296 L1416,656"/>
    <path d="M1186,300 C1260,292 1350,292 1420,296"/>
    <path d="M1186,660 C1260,668 1350,668 1416,656"/>
  </g>
  <!-- swinging arm rotated open -->
  <path d="M1300,480 L1400,380" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1300" cy="480" r="8" fill="#111111"/>

  <!-- orange arrow passing through open gate -->
  <path d="M1220,480 C1280,470 1330,460 1470,450" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M1470,450 L1446,442 M1470,450 L1452,468" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <text x="1230" y="740" font-size="28" fill="#111111" transform="rotate(-1 1230 740)">Gate opens</text>
  <text x="1420" y="410" font-size="26" fill="#111111" transform="rotate(-1 1420 410)">Ready</text>
</svg>
