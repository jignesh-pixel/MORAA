<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe Print, Bradley Hand, Chalkboard SE, Comic Sans MS, cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===== Xiaohei pushing tray with one photo ===== -->
  <g transform="translate(210,560) scale(1.4)">
    <path d="M -20,-2 C -28,-14 -30,-34 -22,-46 C -14,-58 4,-62 16,-56 C 28,-50 34,-36 32,-22 C 30,-8 20,2 4,4 C -8,6 -14,4 -20,-2 Z" fill="#111111"/>
    <circle cx="-4" cy="-40" r="4.5" fill="#ffffff"/>
    <circle cx="10" cy="-38" r="4.5" fill="#ffffff"/>
    <path d="M -10,2 L -13,22" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 6,3 L 10,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M -17,22 L -9,22 M 6,23 L 14,23" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
    <path d="M 22,-24 C 40,-20 52,-14 62,-6" stroke="#111111" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- tray with single photo -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,548 L430,548 C440,548 444,556 438,562 L292,562 C286,556 290,548 300,548 Z"/>
    <path d="M320,500 C318,496 400,494 404,500 C408,522 406,542 402,546 C398,548 324,548 320,544 C316,528 316,508 320,500 Z"/>
    <circle cx="362" cy="518" r="9"/>
  </g>
  <text x="290" y="600" font-size="26" fill="#111111" transform="rotate(-1 290 600)">1 photo in</text>

  <!-- fan-out lines (orange) from tray to four pans -->
  <path d="M420,505 C520,420 600,340 660,270" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M420,510 C520,460 620,420 700,400" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M420,520 C560,540 700,555 860,560" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M420,530 C540,600 660,650 780,680" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <text x="520" y="230" font-size="28" fill="#111111" transform="rotate(-1 520 230)">4+ styles</text>

  <!-- ===== Pan 1 (wide ecommerce shot) - success, checkmark ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="740" cy="270" rx="80" ry="30"/>
    <path d="M660,270 C655,290 700,300 740,300 C780,300 825,290 820,270"/>
    <path d="M818,262 L860,250" />
  </g>
  <rect x="700" y="252" width="80" height="36" rx="4" fill="none" stroke="#111111" stroke-width="3"/>
  <path d="M896,258 L910,272 L936,240" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="655" y="336" font-size="20" fill="#111111" transform="rotate(-1 655 336)">Provider A</text>

  <!-- ===== Pan 2 (close-up) - fails, redirects to backup burner ===== -->
  <!-- ghost backup pan behind -->
  <g stroke="#3b6fd6" stroke-width="3" fill="none" stroke-dasharray="4 8" stroke-linecap="round">
    <ellipse cx="1030" cy="360" rx="76" ry="28"/>
    <path d="M994,398 L994,430 M1066,398 L1066,430"/>
  </g>
  <!-- front pan -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="960" cy="400" rx="78" ry="29"/>
    <circle cx="960" cy="400" r="22"/>
  </g>
  <path d="M944,384 L976,416 M976,384 L944,416" stroke="#d63031" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M1010,395 C1040,380 1055,370 1075,360" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M1075,360 L1054,358 M1075,360 L1064,378" stroke="#e07b1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="890" y="450" font-size="20" fill="#d63031" transform="rotate(-1 890 450)">if fails</text>
  <text x="1000" y="330" font-size="20" fill="#3b6fd6" transform="rotate(-1 1000 330)">Provider B</text>

  <!-- ===== Pan 3 (scale reference, small ruler) - success ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="1010" cy="565" rx="80" ry="30"/>
  </g>
  <path d="M960,558 L1060,558" stroke="#111111" stroke-width="3"/>
  <path d="M970,552 L970,564 M990,552 L990,564 M1010,552 L1010,564 M1030,552 L1030,564 M1050,552 L1050,564" stroke="#111111" stroke-width="2"/>
  <path d="M1096,555 L1110,569 L1136,537" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== Pan 4 (UGC hand-held) - success ===== -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <ellipse cx="930" cy="685" rx="80" ry="30"/>
    <path d="M900,700 C905,715 925,720 935,712 C945,706 948,696 940,690" />
  </g>
  <path d="M1016,678 L1030,692 L1056,660" stroke="#e07b1a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="1150" y="700" font-size="22" fill="#111111" transform="rotate(-1 1150 700)">...and more</text>
</svg>
