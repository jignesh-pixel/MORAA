# Tool configuration only. The application is run directly from backend/ (uvicorn app.main:app);
# this file is not a build definition.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The load harness is a script (tests/load_scenarios/run_load_scenarios.py), not a pytest suite.
norecursedirs = ["tests/load_scenarios", "venv", ".venv", "node_modules"]
markers = [
    "postgres: needs a real PostgreSQL (set TEST_DATABASE_URL, or install pgserver for a throw-away local server)",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv", "alembic/versions"]

[tool.ruff.lint]
# Deliberately small: rules that find real bugs and pass on the current code.
#   E9   syntax / IO errors        F63  invalid comparisons / assertions
#   F7   misplaced statements      F82  undefined names
# Widen later (e.g. F401 unused imports currently has ~75 findings) once a phase can afford the churn.
select = ["E9", "F63", "F7", "F82"]
